'''

[[step]]
id = "0b"
part = 0
title = "Pick your topics and find your claims"
page = "instructions/part0.md"
section = "0b. Pick your topics and find your claims"
minutes = 25
slots = ["0b.*"]
files = ["data/my-topic.json"]
allow = ["Bash(uv run python -m finder:*)"]
summary = "In this step you pick a few topics you are interested in, and select 112 of the dataset's claims about them in the claim finder. You will use 12 claims for development and 100 for evaluation."
checkpoints = [
  { text = "Your 112 claims are selected and saved", task = "Select 112 claims in the [claim finder](/claims/) and save them.", files = ["data/my-topic.json"] },
  { text = "Your answers are in WRITEUP.md", slots = ["0b.*"] },
]
brief = '''
The student picks a few topics they are interested in and selects 112 of the dataset's claims
about them. The claims they save are what every later run uses: the agent's runs in 1c, 1d and 1e,
Part 2 and Part 3. The claim of Part 0 (0c, 0d and 0e) and the claim of 1b are fixed, and the same
for everyone.

The topics are the student's: the first question asks why they chose them, so do not choose them
for the student. Which claims to select is their choice too. Once they have named their topics,
help with the searching as much as they ask (goal 3): explain why a search returned what it did,
what the counts mean and how the three ways of searching differ, and suggest other words for a
topic they have named. Never check a claim against Wikipedia, and never say whether a claim's
label is right.

The claim finder is the screen that opens from the link in this step's task, or from "Find claims"
at the top of the homework page. It searches about 11,700 HoVer claims. A claim is searched by its
own words together with the titles of the articles the dataset lists for it and Wikipedia's
one-line description of each article. There are three ways to search:

- by keyword: the claims that contain at least one of the student's words, ranked by BM25, a
  standard score for how well a text's words match the query's words, in which a rare word counts
  for more than a common one;
- by meaning: every claim, ranked by how close its vector is to the vector of what the student
  typed. A word vector is a short list of numbers for one word, made from a large amount of text
  so that words used in similar ways get similar numbers, and a text's vector is the average of
  its words' vectors. So it can find a claim that shares no word with what they typed;
- both: the two rankings combined. Each claim scores 1/(60 + its rank by keyword) plus 1/(60 + its
  rank by meaning), and a ranking it is not in adds nothing.

The claim finder does not pick claims. The student searches one topic at a time, reads down the
ranked list (50 at a time, with "Show 50 more"), and presses Select on each claim they want; a
selected claim's button becomes Remove. Then they search another topic and select more. A line at
the top counts the selection and its labels, and "Show my selection" lists it. The selection is
kept in the browser, so a new search or a reload does not lose it. Above the results, the screen
says how many claims contain all of the student's words. The dataset has hundreds of claims on a
broad area such as film or basketball and only a few dozen on a narrow one, and the best claims
for a search come first, so further down, the list may stop being about a narrow topic. That is
why most students need two to four topics to reach 112.

"Save these as my claims" works only with exactly 112 claims, at least 30 labeled supported and at
least 30 labeled not supported, so that an agent that always gives the same answer cannot score
well; each refusal is a full sentence on the screen. Saving puts the claims in the order of their
ids, which mixes the topics, so that later steps' "first eight" and "first five" are not all from
one topic. The first six supported and the first six not supported in that order become the 12
development claims, in data/dev.jsonl, and the other 100 the evaluation claims, in data/eval.jsonl.
Saving replaces the sample claims those two files ship with, and writes a note of the topics to
data/my-topic.json, which is what ticks this step. Saving again replaces the claims until the agent
has run on them in 1c, 1d or 1e (anything in runs/part1/before, runs/part1/after or runs/part2);
after that the claim finder refuses, because the runs would no longer match the claims. Its refusal
says to rename those three folders and do the runs of 1c, 1d and 1e again; that includes the full
run of 1e again, about 10 minutes and about 28 cents. Rename them only if the student asks for
exactly that after you have said what it costs.

When the student asks, you may read data/dev.jsonl, data/eval.jsonl and data/my-topic.json and
show what they hold: how many claims, how many of each label and of each number of articles, a
claim word for word.

If the screen will not run in the student's browser at all, there is an emergency path in the
terminal. Run it only when the student asks for it after the screen has failed, with their topics
exactly as they give them:

    uv run python -m finder "<a topic>"
    uv run python -m finder --save "<a topic>" "<another topic>"

The first prints the ten best claims for a topic by keyword, by meaning and both. The second saves
the best 112, split evenly among the topics given (half supported and half not), without the
student selecting them. Paste the output in full. If neither the screen nor the second command
saves their claims, tell the student in one line to post what they see in #comp440-f26 on Slack
right away, because the steps after this one stay locked on the homework page until their claims
are saved.

The two answers are theirs: why they chose their topics, and a description of the overall approach
of the retrieval code in finder/search.py (lines 1 to 165, which the question links to), in three
sentences. Explain any line, function or idea in finder/search.py they ask about, and paste the
part with its line numbers. The overall description is theirs to write (goal 3): do not sum up the
file's approach in a few sentences for them, and do not say what their three sentences should
cover.
'''

