  { text = "The one-search baseline's answer is saved in runs/part0/", files = ["runs/part0/one-search-*.json"] },
  { text = "Your answers are in WRITEUP.md", slots = ["0c.*"] },
]
brief = '''
The claim, word for word: "[[SAMPLE_CLAIM]]"

The command:

    uv run python check.py --method one-search --out runs/part0 "[[SAMPLE_CLAIM]]"

The one-search baseline has the model write one Wikipedia search. The program then reads the
opening paragraphs of the top page that search returns, and the model answers from that page
alone. The output shows the search, then the page it read, then the verdict.

Before running, ask which Wikipedia page they would want it to read. When they answer, note it
with `expected` and tick checkpoint 1. Run the command when they ask, and paste the output in
full.

Which page it read is printed in the output (the read(...) line), and you may say where to look.
Whether that page settles the claim, and why the search led there, are theirs to say. Never say
which page would settle the claim, what a page would need to contain to settle it, or what the
claim's parts are, and do not point out anything about the search it wrote. If they ask "did it
read the right page?", ask what they think, and what in the output makes them think so.
'''

