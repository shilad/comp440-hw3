goal = "Whether the agent reaches the dataset's label, and whether it gets there for a good reason."
checkpoints = [
  { text = "The agent's run on the 12 development claims is saved", files = ["runs/part1/before/report.txt"] },
  "You have read six traces closely in the results viewer",
  { text = "Your table and answer are in WRITEUP.md", slots = ["1c.*"] },
]
brief = '''
The command, for the 12 development claims (about 2 minutes, a few cents on the student's key):

    uv run python evaluate.py data/dev.jsonl --methods agent --out runs/part1/before

This run is the "before" that 1d compares with, so it should use the starting instructions.md.
Before running, check with `git diff --stat -- instructions.md`; if the file has changed, say so
in one line and ask whether to run anyway. Then ask what they expect, for example on how many of
the 12 claims the agent's verdict will match the dataset's label. When it finishes, paste the
output in full, and say the run is in the results viewer as runs/part1/before. Its report is
saved in runs/part1/before/report.txt.

The student picks six claims to read closely: two each that need 2, 3 and 4 articles, and for
each number one the agent got right and one it got wrong, where there is one. The picking is
theirs. If they ask, you may list the 12 claims with their number of articles and whether the
agent's verdict matched the dataset's label, from runs/part1/before/agent.jsonl. That is the
run's output.

When they have picked and ask, you may fill the table's columns that come from the run (the
number, the claim's first few words, its number of articles, and whether it matched the
dataset's label) for their six claims. The last column, whether it got there for a good reason
and why, is theirs, and so is the question after the table. Never say whether a trace shows a
good reason.

To show a trace, paste it from runs/part1/before/agent.jsonl, one lookup per line, or point them
to the results viewer, which shows each lookup's full result. Do not run check.py to show a
trace: it would give a new trace, not the one in the run. check.py is there if the student wants
to check one claim on its own: `uv run python check.py --method agent "<claim>"`.

data/dev.jsonl also lists, for each claim, the articles the dataset's authors used. Do not bring
them up: they bear on the judgment the student is making. If the student asks what the file
holds, show them.

Tick checkpoint 2 when they say they have read their six traces.
'''

[[step]]
id = "1d"
part = 1
title = "Write the agent's instructions"
page = "instructions/part1.md"
section = "1d. Write the agent's instructions"
minutes = 35
slots = ["1d.*"]
files = ["runs/part1/after/report.txt"]
allow = ["Bash(uv run python evaluate.py:*)", "Bash(uv run python check.py:*)"]
summary = "Write the agent's instructions, and see how its traces change."
goal = "How much the agent's behavior depends on its instructions."
checkpoints = [
  "Your own instructions are in instructions.md",
  { text = "The second run on the 12 development claims is saved", files = ["runs/part1/after/report.txt"] },
  "You have compared the two runs in the results viewer",
  { text = "Your answers are in WRITEUP.md", slots = ["1d.*"] },
]
brief = '''
instructions.md is what the model is told before every claim: run_agent() reads it at the start
of each check, so whatever the file says when a run starts is what the agent follows. It starts
with three sentences that only say what the tools are.

The student writes their own instructions in instructions.md, in their editor. At a minimum the
step asks theirs to say how to break a claim into the pieces that have to be checked, when to use
wikidata instead of reading a page, when the agent has enough evidence to stop, and when to
answer *doesn't say*. Never edit instructions.md, never propose a rule or a sentence for it, and
never say whether what they wrote covers those points or is any good. You may explain how the
file reaches the model.

When they say they have written their instructions, check that the file has changed with
`git diff --stat -- instructions.md`, and tick checkpoint 1.

The command, for the 12 development claims again (about 2 minutes, a few cents):

    uv run python evaluate.py data/dev.jsonl --methods agent --out runs/part1/after

Before running, ask what they expect to change in the traces. When it finishes, paste the output
in full, and say the two runs can be compared in the results viewer: "Compare two runs", with
runs/part1/before and runs/part1/after.

If they change instructions.md again after runs/part1/after exists, the same command gives back
the saved results and runs nothing. Tell them so when it applies: a fresh run needs a new folder,
such as runs/part1/after-2, and the name is theirs to choose.

What changed in the traces, and whether it was the change they expected, are theirs to say. Do
not compare the two runs for them. If they ask whether a change in the score is real: the model
does not give the same answer every time, so 12 claims are too few to prove a change helped,
which is why the step asks them to read the traces and not only the score.

Tick checkpoint 3 when they say they have compared the runs.
'''

[[step]]
id = "1e"
part = 1
title = "Start the full run, and predict"
page = "instructions/part1.md"
section = "1e. Start the full run, and predict"
minutes = 15
slots = ["1e.*"]
files = ["runs/part2/no-tools.jsonl"]
allow = ["Bash(uv run python evaluate.py:*)"]
summary = "Start the full run in your own terminal tab, and write your predictions while it runs."
goal = "Nothing yet. You commit to predictions before you see any results, so that later you can tell where you were surprised."
checkpoints = [
  { text = "The full run has started", files = ["runs/part2/no-tools.jsonl"] },
  { text = "Your predictions and answer are in WRITEUP.md", slots = ["1e.*"] },
]
brief = '''
Nothing in this step may show the student a result before their predictions are typed.

The full run is the student's to start, in a new terminal tab, in the homework's folder:

    uv run python evaluate.py data/eval.jsonl --out runs/part2

It runs the no-tools baseline, the one-search baseline and the agent on the 200 evaluation
claims, one version after another. It takes about [[EVAL_MINUTES]] minutes and costs about
[[EVAL_COST]] on their key. It prints a progress line every ten claims and saves each result as
it finishes. If it stops, the same command picks up where it left off. When it is done it prints
two tables and saves them in runs/part2/report.txt. If they ask how to start it, give them the
command above. If they ask you to start it instead, do it in the background, and say once that
it will stop if this session is closed.

While it runs, the student fills in the predictions table under 1e in WRITEUP.md. For each
version they guess the share of claims it will get right, as a percentage, for claims that need
2, 3 and 4 articles, with a reason. Then they answer how many lookups the agent will make per
claim on average, and whether that will grow with the number of articles. A guess is fine; the
reasons are what is graded.

Never suggest a number or a reason. Never say what the run has shown so far, and do not open
anything in runs/part2. If they ask how the run is going, point them to its terminal tab. If they
ask for their own earlier results, such as the 1c report, you may show them.

This is a good place to stop for the day. The run does not need this session open.
'''

# ---- Part 2: The agent against the baselines ----------------------------------------------

[[step]]
id = "2a"
part = 2
title = "Compare accuracy"
page = "instructions/part2.md"
section = "2a. Compare accuracy"
minutes = 18
slots = ["2a.*"]
files = ["runs/part2/report.txt"]
allow = ["Bash(uv run python evaluate.py:*)"]
summary = "See how often each version matched the dataset's label, and compare that with your predictions."
goal = "How often each version matched the dataset's label, by number of articles, and how that compares with your predictions."
checkpoints = [
  { text = "The full run is finished", files = ["runs/part2/report.txt"] },
  "You have opened the run in the results viewer",
  { text = "The report and your answers are in WRITEUP.md", slots = ["2a.*"] },
]
brief = '''
The full run from 1e should be finished: its terminal tab ends with two tables, and
runs/part2/report.txt exists. Check with `ls runs/part2`. If report.txt is missing, the run
stopped early or is still going. The student starts the same command again in their own terminal
tab, and it picks up where it left off:

    uv run python evaluate.py data/eval.jsonl --out runs/part2

If they ask you to start it instead, do it in the background, and say once that it will stop if
this session is closed. Do not run it just to print the report: on a run that is not finished,
that command carries on running, which takes a long time and costs money.

When they ask, read runs/part2/report.txt, show it in the chat in a code block, and paste it
word for word into the empty ``` block under 2a in WRITEUP.md. The run is in the results viewer
as runs/part2. Tick checkpoint 2 when they say they have opened it.

The report's first table gives, for each version and each number of articles, how many claims
matched the dataset's label, as counts such as 41/67. If asked, you may turn counts into
percentages. HoVer labels each claim *supported* or *not supported*, so *refuted* and *doesn't
say* both count as *not supported*; explain it if asked. The second table gives the average
lookups, tokens, seconds and cost per claim.

You may show their predictions from 1e when they ask. Comparing the predictions with the
results, saying where they were furthest off, whether the gap between the agent and the
one-search baseline grows, and what the no-tools result says about these claims, are theirs.
'''

[[step]]
id = "2b"
part = 2
title = "Compare cost"
page = "instructions/part2.md"
section = "2b. Compare cost"
minutes = 12
slots = ["2b.*"]
allow = ["Bash(uv run python evaluate.py:*)"]
summary = "See what the agent costs compared with one search, and decide when that is worth paying."
goal = "What the agent costs compared with the one-search baseline, and when that extra cost is worth paying."
checkpoints = [
  "You have looked for claims where the agent used all 12 lookups",
  { text = "Your answers are in WRITEUP.md", slots = ["2b.*"] },
]
brief = '''
No new run is needed. This step reads the second table of the full run's report,
runs/part2/report.txt: the average lookups, tokens, seconds and cost per claim for each version.
Show it when asked.

In the results viewer the student can filter the run's claims to those where the agent used all
12 lookups. If they ask, you may list those claims from runs/part2/agent.jsonl (its "steps" field
counts lookups) with each claim's first few words, and paste a trace when asked. Tick checkpoint
1 when they have looked, whether or not there are any.

How much more the agent costs, for which claims that is worth paying, and what the agent was
doing in a trace, are theirs to say. Point them to the numbers; do not make the comparison for
them.
'''

[[step]]
id = "2c"
part = 2
title = "Check the evidence yourself"
page = "instructions/part2.md"
section = "2c. Check the evidence yourself"
minutes = 35
slots = ["2c.*"]
allow = ["Bash(uv run python lookup.py:*)"]
summary = "Check whether the agent's quoted evidence really supports its verdicts, for ten claims."
goal = "Whether the agent's quoted evidence really supports its verdicts, and so whether accuracy alone is a fair measure of it."
checkpoints = [
  "You have checked the quoted evidence for ten claims yourself",
  { text = "Your table and answers are in WRITEUP.md", slots = ["2c.*"] },
]
brief = '''
The student checks whether the agent's quoted evidence really supports its verdicts. A quote can
be real and still not support the verdict.

Which ten claims is fixed by a rule: in the results viewer, open the Part 2 run (runs/part2),
filter the claims table to those where the agent answered *supported* or *refuted*, and take the
first ten rows. Do not pick claims yourself, and do not suggest others.

For each claim they ask about, you may show the claim word for word, the agent's verdict, its
quoted evidence and its explanation, from runs/part2/agent.jsonl, and say which lookup in the
trace each quote came from. To show a page as the agent read it, run what they ask:

    uv run python lookup.py read "<page title>"
    uv run python lookup.py read "<page title>" "<section>"

The live page is at https://en.wikipedia.org/wiki/ followed by its title, with spaces as
underscores; give the address when asked. lookup.py also adds each call to
runs/part1/lookups.jsonl, which was 1b's record, and says so in its last line. That is expected,
and it does not change anything in WRITEUP.md.

Never say whether a quote supports the verdict, whether it is relevant, or whether the agent was
right. When asked, you may fill the table's first three columns (the number, the claim's first
few words, the agent's verdict) for the ten claims; the last two columns and the questions are
theirs. Tick checkpoint 1 when they say they have checked all ten.
'''

[[step]]
id = "2d"
part = 2
title = "Find where Wikipedia has changed"
page = "instructions/part2.md"
section = "2d. Find where Wikipedia has changed"
minutes = 30
slots = ["2d.*"]
allow = ["Bash(uv run python lookup.py:*)"]
summary = "Find claims where today's Wikipedia disagrees with the dataset's label."
goal = "What it means to judge a system that reads today's Wikipedia against labels made from the Wikipedia of 2017."
checkpoints = [
  "You have found two claims where today's Wikipedia disagrees with the dataset's label, or the closest case after reading ten",
  { text = "Your table and answer are in WRITEUP.md", slots = ["2d.*"] },
]
brief = '''
HoVer's labels were made from Wikipedia as it was in 2017. The agent reads today's Wikipedia.
Pages change, so an answer scored as wrong can be a sound reading of today's page.

In the results viewer the student filters the Part 2 run (runs/part2) to the claims the agent got
"wrong", and looks for ones where the agent's evidence is sound and today's page disagrees with
the dataset's label. They need at least two. If after reading ten of the agent's wrong answers
they have found fewer than two, they write up what they found and describe the closest case.

When asked, show a claim word for word, its dataset label (from data/eval.jsonl), and the agent's
verdict, evidence and trace (from runs/part2/agent.jsonl). Run the lookups they ask for, to see
a page as it is today:

    uv run python lookup.py read "<page title>"
    uv run python lookup.py read "<page title>" "<section>"
    uv run python lookup.py search "<query>"

lookup.py also adds each call to runs/part1/lookups.jsonl, which was 1b's record. That is
expected, and it does not change anything in WRITEUP.md.

To see an older version of a page, the student opens it on Wikipedia, chooses "View history",
and picks a version from 2017. Explain that if asked; the student does it in their browser.

Never say which claims are cases of a changed page, whether the agent's evidence is sound, or
what changed on a page. When asked, you may fill the table's columns for a claim's first few
words and the dataset's label, for claims the student names; the other columns and the question
are theirs. Tick checkpoint 1 when they say they have found two, or have read ten wrong answers.
'''

# ---- Part 3: Your own claims --------------------------------------------------------------

[[step]]
id = "3a"
part = 3
title = "Pick a topic and write your claims"
page = "instructions/part3.md"
section = "3a. Pick a topic and write your claims"
minutes = 30
slots = ["3a.*"]
files = ["data/my-claims.jsonl"]
allow = ["Edit(data/my-claims.jsonl)", "Write(data/my-claims.jsonl)"]
summary = "Write at least eight claims of your own, on a topic you know well."
goal = "Nothing yet. You build a set of claims on a topic you know better than most people, to test the agent on."
checkpoints = [
  { text = "Your topic and at least eight claims are in WRITEUP.md", slots = ["3a.*"] },
  { text = "Your claims are copied into data/my-claims.jsonl", files = ["data/my-claims.jsonl"] },
]
brief = '''
The topic, the claims, their verdicts and their sources are the student's. Never suggest a topic,
a claim, a fact to change or a source. Never check their claims against Wikipedia, or say whether
a verdict is right: the run in 3b does that, and the point is to compare it with what they know.

The step asks for at least eight claims, typed in the table under 3a in WRITEUP.md: some true and
some false; at least two that need two or more Wikipedia articles; at least two where they think
Wikipedia doesn't say, or says something wrong. Each has their own verdict (*supported*,
*refuted* or *doesn't say*) and the source they would trust. When asked, say which part of that
mix is missing, going by what the table shows; you may ask which claims they think need two or
more articles. Never propose a claim to fill a gap.

When they ask, copy the table into data/my-claims.jsonl, one JSON object per line, with each
claim's words exactly as typed:

    {"id": "mine-1", "claim": "...", "source": "mine", "label": "supported"}

The id is "mine-" and the claim's number in the table. The label is their verdict, spelled
exactly supported, refuted or doesn't say. If a verdict is written another way ("true",
"Supported", "unclear"), ask which of the three they mean. Then paste the file in full.

Results are saved by claim id. Once 3b has run, a claim whose words change needs a new id (the
next unused number), and new claims go at the end with new ids. Otherwise 3b's command gives back
the old claim's results. Say so if they change claims after 3b.
'''

[[step]]
id = "3b"
part = 3
title = "Run the agent on your claims"
page = "instructions/part3.md"
section = "3b. Run the agent on your claims"
minutes = 12
slots = ["3b.*"]
files = ["runs/part3/before/report.txt"]
allow = ["Bash(uv run python evaluate.py:*)", "Bash(uv run python check.py:*)"]
summary = "Run the agent and the one-search baseline on your claims, and see where they agree with you."
goal = "Where the agent and the one-search baseline agree with your own verdicts on your claims."
checkpoints = [
  { text = "Both versions have run on your claims", files = ["runs/part3/before/report.txt"] },
  { text = "Your answers are in WRITEUP.md", slots = ["3b.*"] },
]
brief = '''
The command (about 3 minutes, a few cents on the student's key):

    uv run python evaluate.py data/my-claims.jsonl --methods one-search,agent --out runs/part3/before

For the student's own claims the label is their verdict, and a version agrees only if it gives
the same one of the three verdicts. Before running, ask what they expect, for example on how many
of their claims each version will agree with them. When it finishes, paste the output in full,
and say the run is in the results viewer as runs/part3/before.

If they ask, you may show, claim by claim, their verdict beside each version's, from
data/my-claims.jsonl and the two files in runs/part3/before. Do not say who is right, and do not
say why a version disagreed. What surprised them is theirs to say.

If they add claims later, the same command runs only the new ones. check.py is there if they want
to check one claim on its own: `uv run python check.py --method agent "<claim>"`. Its trace will
not match the one in the run.
'''

[[step]]
id = "3c"
part = 3
title = "Sort the failures"
page = "instructions/part3.md"
section = "3c. Sort the failures"
minutes = 25
slots = ["3c.*"]
allow = ["Write(runs/part3/claude-labels.md)", "Edit(runs/part3/claude-labels.md)", "Bash(uv run python evaluate.py:*)"]
summary = "Label why the agent failed on your claims, and compare your labels with Claude's."
goal = "Why the agent fails on your claims, and whether Claude reads the same failures the same way you do."
checkpoints = [
  "Claude has labeled the failures and saved its labels, without showing you",
  "You have labeled each failure, with the line of the trace that shows it",
  "Claude's labels are in the last column of your table",
  { text = "Your answers are in WRITEUP.md", slots = ["3c.*"] },
]
brief = '''
This step compares the student's reading of the agent's failures with yours. The comparison only
means something if your labels are made without seeing theirs, so the order below is the whole
point of the step. It overrides the general instruction to read WRITEUP.md at the start: in this
step, do not open WRITEUP.md until your labels are saved, because their labels may already be in
it.

1. When the student asks, label the failures yourself, first. Work only from the files. A failure
   is a claim where the agent's verdict differs from the student's: the lines with
   "correct": false in runs/part3/before/agent.jsonl, whose ids match the claims in
   data/my-claims.jsonl (the student's verdict is the "label" there). Read each failure's trace
   and give it one label from the list below, with the line of the trace that shows it. Before
   saving, tell the student in one line that Claude Code may show the start of the file as it is
   written, and that they can skip past it. Save your labels in runs/part3/claude-labels.md, one
   line per claim: the claim's number (mine-3 is claim 3), your label, and the line of the trace.
   Then say only how many labels you saved, and tick checkpoint 1. Do not show the labels, and do
   not hint at them.
2. The student reads each of those traces in the results viewer, and types their own label, and
   the line of the trace that shows it, into the table under 3c. While they work you may paste a
   trace, explain what a label means, or explain a lookup, when asked. Never say which label a
   trace deserves, and do not show your labels yet. If they ask to see yours now, say that the
   comparison only works once theirs are typed, and ask which claim they are on.
3. When they ask to see yours, first read the table under 3c in WRITEUP.md. If every failure has
   their label, tick checkpoint 2, show your labels, and write each into the "Claude's label"
   column of its row (that column is meant for your labels), then tick checkpoint 3. If some
   rows are still empty, say which, and wait. If a row names a claim you did not label, write
   "not labeled" in its cell, and do not label it now, since you have seen theirs.
4. Then they answer the questions: where the two of you disagreed and who they think is right,
   and which kind of failure was most common. Never say who is right, and do not argue for your
   labels. If asked why you chose one, quote the trace line you saved with it.

The labels:

- *wrong page*: it never found the page that settles the claim;
- *stopped too early*: it answered before checking every piece;
- *misread*: it read the right page and drew the wrong conclusion;
- *wouldn't say "doesn't say"*: it forced a verdict Wikipedia does not support;
- *Wikipedia is missing or wrong*: the agent did fine and Wikipedia let it down;
- or a label of their own, and of yours if none of these fits.

If the agent disagreed with the student on fewer than three claims, the step asks them to go back
to 3a, add harder claims, and run 3b's command again. Adding claims is 3a's work, in its own
session. The command can be run here:

    uv run python evaluate.py data/my-claims.jsonl --methods one-search,agent --out runs/part3/before

It runs only the new claims. Then label the new failures first, the same way, adding them to
runs/part3/claude-labels.md, before the student labels them.
'''

[[step]]
id = "3d"
part = 3
title = "Make one change"
page = "instructions/part3.md"
section = "3d. Make one change"
minutes = 20
slots = ["3d.*"]
files = ["runs/part3/after/report.txt", "runs/part3/after-eval/report.txt"]
allow = ["Bash(uv run python evaluate.py:*)", "Bash(uv run python check.py:*)", "Edit(instructions.md)"]
summary = "Make one change aimed at the most common failure, and measure what it does."
goal = "Whether one change aimed at the most common failure fixes it, and what it does on the 200 evaluation claims."
checkpoints = [
  "You have made one change",
  { text = "The agent has run again on your claims", files = ["runs/part3/after/report.txt"] },
  { text = "The agent has run again on the 200 evaluation claims", files = ["runs/part3/after-eval/report.txt"] },
  "You have compared both pairs of runs in the results viewer",
  { text = "Your answers are in WRITEUP.md", slots = ["3d.*"] },
]
brief = '''
The student decides on one change aimed at the failure they found most common in 3c. It can be
to instructions.md, to a tool (for example what search returns, in wiki.py), or to the limit of
12 lookups (MAX_STEPS in agent.py). Never propose a change, say which change would work best, or
say whether theirs is a good idea. You may explain what a piece of code does, and say where in
the code something they name lives.

They make the change in their editor, or tell you exactly what to change. Make exactly that
change and nothing else, then show the diff with `git diff`. If what they describe is not exact
("make it stop later"), ask for the exact change; do not fill it in. An edit to any file other
than instructions.md makes Claude Code ask the student first. Tick checkpoint 1 once the change
is made.

Then, when they ask, and after asking what they expect (about 3 minutes, a few cents):

    uv run python evaluate.py data/my-claims.jsonl --methods agent --out runs/part3/after

Paste the output in full, and say they can compare runs/part3/before with runs/part3/after in
the results viewer.

Then the student starts the agent on the 200 evaluation claims again, in their own terminal tab:

    uv run python evaluate.py data/eval.jsonl --methods agent --out runs/part3/after-eval

It takes about [[RERUN_MINUTES]] minutes and costs about [[RERUN_COST]]. If they ask how to start
it, give them that command. If they ask you to start it instead, do it in the background, and
say once that it will stop if this session is closed. When it finishes it saves
runs/part3/after-eval/report.txt. They compare runs/part2 with runs/part3/after-eval in the
results viewer. Tick checkpoint 4 when they say they have compared both pairs.

If they revise their change after runs/part3/after exists, the same command gives back the saved
results and runs nothing. Tell them so when it applies: a fresh run needs a new folder, such as
runs/part3/after-2.

Whether it fixed the failure, the numbers before and after, and whether it was worth it, are
theirs to say. You may show any of the reports when asked.
'''

[[step]]
id = "3e"
part = 3
title = "Write it up"
page = "instructions/part3.md"
section = "3e. Write it up"
minutes = 30
slots = ["3e.*"]
summary = "Say what the agent's loop adds, what it costs, and what your topic showed you about Wikipedia."
goal = "What you learned: what the agent's loop adds over one search, what it costs, and what your topic showed you about Wikipedia as a source."
checkpoints = [
  { text = "Your write-up and how you used AI are in WRITEUP.md", slots = ["3e.*"] },
]
brief = '''
Nothing runs in this step. The write-up is the student's. Its questions ask what the agent's loop
adds over one search, using their numbers from Part 2 and their claims from Part 3; what the
agent costs, and when they would not use an agent for a job like this; what their topic showed
them about Wikipedia as a source, and why it was thin or wrong where it was; and how they used AI
in this homework, what they checked themselves, and one decision they made on their own.

When they ask, show their own numbers and words: runs/part2/report.txt,
runs/part3/before/report.txt, runs/part3/after/report.txt, runs/part3/after-eval/report.txt, and
their earlier answers in WRITEUP.md. Never write, suggest, outline or improve a sentence of the
write-up, and never suggest what to say about how they used AI. If they ask you to read a draft
and comment on it, say that the write-up is theirs. You may point out a number that does not
match a report.
'''
