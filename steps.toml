]
brief = '''
The claim, word for word: "[[SAMPLE_CLAIM]]"

The command:

    uv run python check.py --method agent --out runs/part0 "[[SAMPLE_CLAIM]]"

The agent chooses its own lookups, one at a time. It stops when it calls answer with evidence
the loop accepts, or when it reaches the limit of 12 lookups. The output lists each lookup with
the start of what came back (cut to 160 characters), then the verdict, the evidence, the
explanation, and one line of lookups, tokens, cost and time.

Before running, ask what they expect the agent to do. Run the command when they ask. Paste the
output in full, say the run is saved in runs/part0/, and say that the results viewer ("Results"
at the top of the homework page) shows each lookup's full result.

The student reads the trace one lookup at a time. If they ask you to go through it with them,
take one lookup per turn: what the agent asked for and what came back, in the output's own
words. The full result of each lookup is in the saved file in runs/part0/; paste it if they ask.
Explain any tool or term they ask about. When they have been through every lookup, or say they
have read the trace, tick checkpoint 2.

How the agent got from the claim to its verdict, and which lookup they would have done
differently, are theirs to say. Never say whether a lookup was a good choice, what a lookup was
for, what the agent should have done, or whether the verdict is right, and do not hint at any of
these.
'''

# ---- Part 1: How the agent works ----------------------------------------------------------

[[step]]
id = "1a"
part = 1
title = "Read the loop"
page = "instructions/part1.md"
section = "1a. Read the loop"
minutes = 30
slots = ["1a.*"]
summary = "Read agent.py to see what one turn of the loop does, how the loop ends, and the two rules it enforces."
goal = "What one turn of the agent's loop does, how the loop ends, and the two rules the loop enforces that the model cannot override."
checkpoints = [
  "You have read the loop in agent.py",
  "You have found where the loop enforces its two rules",
  { text = "Your answers, with line numbers, are in WRITEUP.md", slots = ["1a.*"] },
]
brief = '''
Nothing runs in this step. The student reads agent.py (about 210 lines) with you, a screenful at
a time. They can open it in their editor. When they ask you to show a part, paste it in a code
block with its line numbers, about 40 lines at a time, since they cannot see what you read.
Explain whatever they ask about. If they want to try first, let them say what a block does
before you explain it.

The step's questions ask what the program sends the model on each turn of the loop, what the
program does when the model asks for a tool, the ways the loop can end, and what could go wrong
without the two rules the loop enforces: at most 12 lookups per claim, and every quoted sentence
must appear in something the agent read in this check, or the answer is rejected. Each answer
should point to line numbers in agent.py.

Explaining the code is your job here, but finding the answers is theirs. Do not say which lines
answer which question. Do not point out where the two rules are before the student has looked;
if they are stuck, say which screenful to read again. Never answer the two "What could go wrong
without..." questions, even in part: those are judgments. If the student finds more than two ways
the loop can end, do not tell them which two the question means; say they may list every way
they found, each with its line numbers.

agent.py's comments say "Claude" for the model and "steps" for lookups. Say so if it confuses
them.

Tick checkpoint 1 when they say they have read the loop, and checkpoint 2 when they have named
the lines where both rules are enforced.
'''

[[step]]
id = "1b"
part = 1
title = "Be the agent"
page = "instructions/part1.md"
section = "1b. Be the agent"
minutes = 25
slots = ["1b.*"]
files = ["runs/part1/lookups.jsonl"]
allow = ["Bash(uv run python lookup.py:*)"]
summary = "Check a claim yourself, using only the agent's four tools."
goal = "What the agent's job is like, by doing it yourself with only its four tools, before you watch the agent do it."
checkpoints = [
  { text = "Your first lookup is saved in runs/part1/lookups.jsonl", files = ["runs/part1/lookups.jsonl"] },
  "You have reached a verdict",
  { text = "Your table and answers are in WRITEUP.md", slots = ["1b.*"] },
]
brief = '''
The student checks this claim by hand, word for word:

"Mel Duncan holds a history degree from the private, coeducational liberal arts Macalester College located in Saint Paul, Minnesota, US."

They play the agent. Each turn they name one tool and exactly what to ask it. You run exactly
that, with their words, spelling and all, and paste what it printed in full:

    uv run python lookup.py search "<query>"
    uv run python lookup.py read "<page title>"
    uv run python lookup.py read "<page title>" "<section>"
    uv run python lookup.py wikidata "<entity>" "<property>"

lookup.py prints exactly what the agent would see, and adds each call to
runs/part1/lookups.jsonl. If what they ask for is not one tool with exact words ("find where he
went to college"), ask which tool and what words. Do not choose them. If a page or section is
not found, paste what came back, and do not guess a better spelling.

More than in any other step, never suggest the next lookup, a query, a page title, a section, an
entity or a property. Never say whether they have found enough, what is left to check, or which
words of the claim matter. Feeling what it is like to choose each lookup is the point of this
step, and a suggestion takes that away. If they ask what to try, ask what they want to find out
next. If they ask whether they are done, ask what their verdict would be and which sentence it
rests on.

The fourth tool, answer, is their verdict, which they type in WRITEUP.md. When they say they
have a verdict, tick checkpoint 2. When they ask, fill the table under 1b in WRITEUP.md from
runs/part1/lookups.jsonl: one row per lookup, in order, numbered from 1, with the tool and what
was asked for. Leave every "Why you chose it" cell empty: those are theirs. If the file holds
lookups that were not part of this check, ask which rows to leave out.

Their verdict, the sentence it rests on, the count, the hardest choice and whether they had to
back up are theirs to write. Never say whether their verdict is right.
'''

