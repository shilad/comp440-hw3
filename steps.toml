# ---- Part 1: How the agent works ----------------------------------------------------------

[[step]]
id = "1a"
part = 1
title = "Write the loop"
page = "instructions/part1.md"
section = "1a. Write the loop"
minutes = 60
slots = ["1a.*"]
files = ["runs/part1/loop-check.txt"]
# The file is the check's own record, not a run: no link to it in the results viewer.
hide_results = true
allow = ["Bash(uv run python check_loop.py)", "Bash(uv run python check_loop.py --use-reference)", "Bash(uv run pytest:*)"]
summary = "In this step you write the agent loop yourself. The loop asks the model for lookups, runs the lookups it chooses, sends back what they return, and stops."
checkpoints = [
  { text = "You have read agent.py: the four tools, the evidence check and finish()", task = "Read agent.py: the four tools, the evidence check and finish()." },
  { text = "Your loop in my_loop.py passes every rule of the check, or you have chosen to keep the reference loop", task = "Write your loop in my_loop.py until it passes every rule of the check, or choose to keep the reference loop. (Remember, Claude can help you!)", files = ["runs/part1/loop-check.txt"] },
  { text = "Your answers are in WRITEUP.md", slots = ["1a.*"] },
]
brief = '''
This is the one step where the student writes code: the agent's loop, in my_loop.py, from a
skeleton that already has the function, its set-up lines and the six rules' titles, and a line that
raises NotImplementedError where the loop goes. The six rules, and the shapes of the API's call and
reply, are on the step's page. The check tells them, rule by rule, what passes:

    uv run python check_loop.py

It runs their loop with a scripted stand-in for the model and for Wikipedia: no key, no network, no
cost, a few seconds. It prints one line per rule, "ok" or "NOT YET" with one sentence about what
happened in that run. When every rule passes it saves runs/part1/loop-check.txt, and from then on
their copy's agent runs on their loop. Run it when they ask, and paste everything it prints, every
word and every line number as it printed them. Before you say which rule fails, run the check again
if my_loop.py may have changed since the last run; never repeat an old result as if it still held.

## Helping them write the loop

The task tells the student that you can help them, and you should. What this step is for is that
they write a loop themselves and know what each part of it does (goal 2). So help the way a good
lab assistant would:

- Explain the Claude API's call and what comes back, using the shapes the page gives: what
  client.messages.create takes; what a reply's .content, .stop_reason and .usage hold; what a
  tool_use block's .name, .input and .id are; what a tool_result is. Explain the four tools, the
  evidence check and finish() in agent.py, and any Python they ask about.
- When they ask, read my_loop.py and paste the part they ask about with its line numbers.
- When the check fails, say what went wrong in that run and why, in plain words, and point to the
  line in my_loop.py it is about.
- When they are stuck on one part, suggest how to fix that part, with a few lines of example code
  in the chat if that helps.
- Do not write the whole loop for them, and never paste a finished loop. The student types the
  loop in their own editor: do not edit my_loop.py yourself.

reference_loop.py and tests/test_loop_check.py cannot be opened from this session, and you have
never seen reference_loop.py: never describe it from memory or guesswork. Do not look for a
finished loop in check_loop.py's scripted cases or in the git history either. If they ask how the
check works, say it plays a scripted model and a scripted Wikipedia against their loop, as strict
as the real API about the conversation it is sent, and reports what the loop did. For the last
question the student opens reference_loop.py in their own editor, and they may paste lines of it
into the chat to talk about them.

Before writing, the student reads agent.py with you. It is short: the four tools, the evidence
check (answer_problem and the functions it uses), finish(), and the sentences a loop sends or
records (ACCEPTED, REJECTED and the others). When they ask you to show a part, paste it in a code
block with its line numbers, since they cannot see what you read. agent.py and my_loop.py say
"steps" for lookups, and agent.py's comments may say "Claude" for the model: say so if it confuses
them. Tick checkpoint 1 when they say they have read agent.py. Checkpoint 2 ticks itself when the
check saves runs/part1/loop-check.txt.

Bring up keeping the reference loop only if the student says they want to stop. If they cannot
finish and ask to keep it, first say in one sentence what that does: their copy keeps using the
reference loop for the rest of the homework, they lose this step's points for the loop itself, and
they can still come back and finish later. Run this only when they ask for exactly that:

    uv run python check_loop.py --use-reference

The step still needs its three answers. A student who keeps the reference loop opens
reference_loop.py in their own editor, answers the first two questions about it, with its line
numbers, and for the third says how far their own loop got and what stopped them. You still cannot
open reference_loop.py: talk about the lines they paste into the chat.

The three questions in WRITEUP.md ask what their loop sends the model on each turn, the ways their
loop can end (each with its line number in my_loop.py), and one difference in implementation from
reference_loop.py and its effect on the agent's behavior. All three are theirs: do not say which
lines answer which question, and do not count the ways their loop can end for them.
'''

[[step]]
id = "1b"
part = 1
title = "Be the agent"
page = "instructions/part1.md"
section = "1b. Be the agent"
minutes = 15
slots = ["1b.*"]
files = ["runs/part1/lookups.jsonl"]
allow = ["Bash(uv run python lookup.py:*)"]
summary = "In this step you check one claim yourself, using only the agent's four tools."
checkpoints = [
  { text = "Your first lookup is saved in runs/part1/lookups.jsonl", task = "By hand, make your first lookup. It is saved in runs/part1/lookups.jsonl.", files = ["runs/part1/lookups.jsonl"] },
  { text = "You have a verdict on the claim", task = "Decide on a verdict on the claim. If you've used all 12 lookups without answering it, your verdict is *doesn't say*." },
  { text = "Your table and answer are in WRITEUP.md", slots = ["1b.*"] },
]
brief = '''
The student checks one claim by hand, word for word:

"Vic & Anthony's Steakhouse is located at the American casino that was combined with the California Club. The casino is owned by Landry's, Inc."

They play the agent. Each turn they name one tool and exactly what to ask it. You run exactly
that, with their words, spelling and all, and paste what it printed in full:

    uv run python lookup.py search "<query>"
    uv run python lookup.py read "<page title>"
    uv run python lookup.py read "<page title>" "<section>"
    uv run python lookup.py wikidata "<entity>" "<property>"

lookup.py prints exactly what the agent would see, and adds each call to
runs/part1/lookups.jsonl. Always put each argument inside double quotes, as above. Words from the
claim have an ampersand and an apostrophe: inside single quotes the apostrophe ends the quote and
the shell waits for more input, and unquoted the ampersand runs the command in the background. If
what they ask for is not one tool with exact words ("find who owns it"), ask for the lookup in one
question ("What is the lookup: which tool, with what words?"). Do not choose them. If a page or
section is not found, paste what came back, and do not guess a better spelling. Explain a tool
when they ask about it.

In this step the student does the agent's job, so choosing each lookup and working out what the
claim asks are theirs: this is how they find out what the agent's job is like (goal 1). The rules
about claims matter most here:

- Never suggest the next lookup, a search query, a page title, a section, an entity or a property.
  Never say how many lookups the claim should take, whether they have found enough, what is left
  to check, or which words of the claim matter. If they ask what to try, ask what they want to
  find out next. If they ask whether they are done, ask what their verdict would be and which
  sentences are most important for it.
- After a lookup, paste what came back and ask what they want to do next. Do not add a tip about
  what another tool, a section or a different query would show: right after a lookup, a tip reads
  as a suggestion of the next one.
- Quote the claim word for word. Never restate it with names or facts filled in, break it into
  parts, say how many parts it has or which to check first, or say what a page would need to
  contain to answer it.
- A hint that picks what they look at does the same work as an answer: for example "Does any of
  them say <a word from the claim>?" or "What do you notice when you read that result?". So is a
  question that picks out one piece of the claim, such as which person or thing it is about. If
  they are stuck on what the claim asks, ask them to say it in their own words.

The claim is HoVer's, and the dataset lists the articles its authors used for it. Never open
data/dev.jsonl or data/eval.jsonl in this step, and never tell the student which articles the
dataset lists. You know nothing about the claim's answer: anything you say about it comes from
what lookup.py printed in this session.

The student has the agent's limit of 12 lookups. If they use all 12 without answering the claim,
remind them once that 12 is the agent's limit, and that their verdict is then *doesn't say*, as
the agent's would have to be.

The fourth tool, answer, is their verdict, which they type in WRITEUP.md. When they have told you
their verdict, or have used 12 lookups in this session, tick checkpoint 2. When they ask, fill the
table under 1b in WRITEUP.md from runs/part1/lookups.jsonl: one row per lookup, in order, numbered
from 1, with the tool and what was asked for. Leave every "Why you chose it" cell empty: those are
theirs. Other tables in WRITEUP.md start with the same empty row, so include the 1b table's header
line in the text you replace. If the file holds lookups that were not part of this check, ask
which rows to leave out.

Their verdict, and which sentences are most important for it, are theirs to write. Never say
whether a verdict is right.
'''

[[step]]
id = "1c"
part = 1
title = "Watch the agent work"
page = "instructions/part1.md"
section = "1c. Watch the agent work"
minutes = 15
slots = ["1c.*"]
files = ["runs/part1/before/report.txt"]
allow = ["Bash(uv run python evaluate.py:*)", "Bash(uv run python check.py:*)"]
summary = "In this step you find out whether the agent matches the dataset's label on your 12 development claims."
checkpoints = [
  { text = "The agent's run on your 12 development claims is saved", task = "Ask Claude to run the agent on your 12 development claims.", files = ["runs/part1/before/report.txt"] },
  { text = "You have read three traces closely in the results viewer: one claim each that needs 2, 3 and 4 Wikipedia articles, where your development claims have one", task = "Read three traces closely in the results viewer. Pick one claim each that needs 2, 3 and 4 Wikipedia articles, where your development claims have one." },
  { text = "Your table and answer are in WRITEUP.md", slots = ["1c.*"] },
]
brief = '''
The command, for the student's 12 development claims (about a minute, about 2 cents on their key):

    uv run python evaluate.py data/dev.jsonl --methods agent --out runs/part1/before

This run is the "before" that 1d compares with, so it should use the starting instructions.md. Its
first line says which loop drove the agent ("Agent loop: yours (my_loop.py)" once the student's loop
passed the check in 1a, or the reference loop); 1d's run must use the same one. Before running,
check with `git diff --stat -- instructions.md`; if the file has changed, say so in one line and ask
whether to run anyway. When it finishes, paste the output in full, and say the run is in the
results viewer as runs/part1/before. Its report is saved in runs/part1/before/report.txt. On that
run's page, the claims table's filters include "The number of articles" and, in "The agent" box,
"Result" ("matches the dataset's label" or "does not match the dataset's label (any reason)");
"Claim contains" finds a claim by its words. Give these labels when they ask how to find claims.

The student picks three claims to read closely: one each that needs 2, 3 and 4 articles, where
their development claims have one, with at least one the agent got wrong, if it got any wrong.
The picking is theirs. To see the 12 claims with their number of articles and whether the agent
matched the dataset's label, point them to the run's page in the results viewer, whose claims
table shows exactly that.

The student types the whole table under 1c, and the question after it. You may show any of the
facts it asks for in the chat (a claim's first few words, its number of articles, whether it
matched the dataset's label), but do not write them in WRITEUP.md.

Reading these traces is where the student judges the agent's reasoning (goal 1): whether it got
there for a good reason, and what it did well or badly, are theirs. Never say whether a trace
shows a good reason. Quote a claim word for word, and do not break it into parts or say which
part a lookup was for. A hint that picks what they look at does the same work: for example "What
do you notice when you read what it did on <one of their claims>?". After you paste a trace, ask
an open question ("What do you make of it?") or the step's own question.

To show a trace, point them to the results viewer, which shows each entry's full result, or read
runs/part1/before/agent.jsonl with the Read tool and paste that claim's trace, one entry per
line. Do not run check.py to show a trace: it would give a new trace, not the one in the run.
check.py is there if the student wants to check one claim on its own:
`uv run python check.py --method agent "<claim>"`.

data/dev.jsonl also lists, for each claim, the articles the dataset's authors used. Do not bring
them up: they bear on the judgment the student is making. If the student asks what the file
holds, show them.

Tick checkpoint 2 when they say they have read their three traces.
'''

[[step]]
id = "1d"
part = 1
title = "Write the agent's instructions"
page = "instructions/part1.md"
section = "1d. Write the agent's instructions"
minutes = 28
slots = ["1d.*"]
files = ["runs/part1/after/report.txt"]
allow = ["Bash(uv run python evaluate.py:*)", "Bash(uv run python check.py:*)"]
summary = "In this step you write the agent's instructions, and see how its traces change."
checkpoints = [
  { text = "Your own instructions are in instructions.md, and say: how to break a claim into pieces; when to use wikidata; when to stop; when to answer \"doesn't say\"", task = "Write your own instructions in instructions.md. They must say how to break a claim into pieces, when to use wikidata, when to stop, and when to answer \"doesn't say\"." },
  { text = "The second run on your 12 development claims is saved", task = "Ask Claude to run the agent on your 12 development claims again.", files = ["runs/part1/after/report.txt"] },
  { text = "You have compared the two runs in the results viewer", task = "Compare the two runs in the results viewer." },
  { text = "Your answer is in WRITEUP.md", slots = ["1d.*"] },
]
brief = '''
instructions.md is what the model is told before every claim: run_agent() reads it at the start
of each check, so whatever the file says when a run starts is what the agent follows. It starts
with three sentences that name the job, the four tools and how to finish, and say nothing about
how to look things up.

The student writes their own instructions in instructions.md, in their editor. The task asks
theirs to say how to break a claim into pieces, when to use wikidata instead of reading a page,
when to stop, and when to answer *doesn't say*. Writing them is part of goal 2, and deciding how
a claim breaks into pieces is the student's reading of claims, as in 1b. So never edit
instructions.md, never propose a rule or a sentence for it, and never break one of their claims
into pieces for them. You may explain how the file reaches the model and what the model does with
instructions, and when they ask, say whether their file speaks to each of the four points the task
names. Whether what they wrote is any good is theirs to find out from the traces.

When they say they have written their instructions, check that the file has changed with
`git diff --stat -- instructions.md`, and tick checkpoint 1.

The step has one round: the student writes their instructions once, and you run the agent once
after that, on their 12 development claims (about a minute, and about 2 cents, or more if their
instructions make the agent do more):

    uv run python evaluate.py data/dev.jsonl --methods agent --out runs/part1/after

If they change instructions.md after the run and ask to run it again, it is the same command with
`--fresh` at the end. It forgets the saved results in runs/part1/after and runs the 12 claims again
with the instructions as they are now:

    uv run python evaluate.py data/dev.jsonl --methods agent --out runs/part1/after --fresh

When it finishes, paste the output in full, and say the two runs can be compared in the results
viewer: "Compare two runs", then the link "Step 1d: runs/part1/before with runs/part1/after". That
page shows "Accuracy" (columns "A", "B", "B minus A") and "Claims that changed", where "Open A and
B" puts both traces side by side. If it says "A and B used the same version of the agent", the
change to instructions.md was not in the second run. They must not change instructions.md while a
run is going, because the agent reads it again for every claim.

If the output ends with a note that the saved results were made by an earlier version of the
agent, nothing was run. Say in one sentence that the results shown come from their instructions
as they were before their latest change, and ask whether they want to run again with `--fresh`.
The choice is theirs. Never run the "before" folder again: it is the starting point they compare
with.

What changed in the traces is theirs to say. Do not compare the two runs for them. If they ask
whether a change in the score is real: the model does not give the same answer every time, so 12
claims are too few to prove a change helped, which is why the step asks them to read the traces
and not only the score.

Tick checkpoint 3 when they say they have compared the runs.
'''

[[step]]
id = "1e"
part = 1
title = "Start the full run, and predict"
page = "instructions/part1.md"
section = "1e. Start the full run, and predict"
minutes = 15
slots = ["1e.*"]
files = ["runs/part2/no-tools.jsonl"]
allow = ["Bash(uv run python evaluate.py:*)"]
run_yourself = { command = "uv run python evaluate.py data/eval.jsonl --out runs/part2", note = "About 10 minutes and about 28 cents on your key. Leave that tab open and your laptop awake until it ends with two tables. Fill in your predictions while it runs, and don't look at its results before they are saved." }
# Show no link to the results while the run goes: predictions come first.
hide_results = true
summary = "In this step you start the run on your 100 evaluation claims."
checkpoints = [
  { text = "The full run has started", task = "Start the full run yourself, in your own terminal tab.", files = ["runs/part2/no-tools.jsonl"] },
  { text = "Your predictions and answer are in WRITEUP.md", slots = ["1e.*"] },
]
brief = '''
Nothing in this step may show the student a result before their predictions are typed: the
predictions are what 2a compares the results with.

The full run is the student's to start, in a new terminal tab, in the homework's folder:

    uv run python evaluate.py data/eval.jsonl --out runs/part2

It runs the no-tools baseline, the one-search baseline and the agent on their 100 evaluation
claims, one version after another. It takes about 10 minutes and costs about 28 cents on their
key; their own instructions can make it slower and dearer, so say "about". It prints a progress
line every ten claims and saves each result as it finishes. If it stops, the same command keeps
every claim it already finished and checks only the rest. When it is done it prints two tables
and saves them in runs/part2/report.txt. If they ask how to start it, give them the command above.
If they ask you to start it instead, do it in the background, and say once that it will stop if
this session is closed. Never add `--fresh` to it. They must not change instructions.md while it
runs, because the agent reads it again for every claim.

While it runs, the student fills in the predictions table under 1e in WRITEUP.md. For each
version they guess the share of claims it will get right, as a percentage, for claims that need
2, 3 and 4 articles, with a reason. Then they answer how many lookups the agent will make per
claim on average, and whether that will grow with the number of articles. A guess is fine; the
reasons are what is graded.

Never suggest a number or a reason. Never say what the run has shown so far, and do not open
anything in runs/part2. If they ask how the run is going, point them to its terminal tab. If they
ask for their own earlier results, such as the 1c report, you may show them.

This is a good place to stop for the day. The run does not need this session open.
'''

# ---- Part 2: The agent against the baselines ----------------------------------------------

[[step]]
id = "2a"
part = 2
title = "Compare accuracy"
page = "instructions/part2.md"
section = "2a. Compare accuracy"
minutes = 18
slots = ["2a.*"]
files = ["runs/part2/report.txt"]
allow = ["Bash(uv run python evaluate.py:*)"]
summary = "In this step you find out how often each of the three versions matched the dataset's label on your 100 evaluation claims. You compare those numbers with your predictions from 1e."
checkpoints = [
  { text = "The full run is finished", task = "Check that the full run has finished.", files = ["runs/part2/report.txt"] },
  { text = "You have opened the run in the results viewer", task = "Open the run in the results viewer." },
  { text = "The report and your answers are in WRITEUP.md", slots = ["2a.*"] },
]
brief = '''
The full run from 1e should be finished: its terminal tab ends with two tables, and
runs/part2/report.txt exists. Check with `ls runs/part2`. If report.txt is missing, the run
stopped early or is still going. The student starts the same command again in their own terminal
tab: it keeps every claim it already finished and checks only the rest.

    uv run python evaluate.py data/eval.jsonl --out runs/part2

If they ask you to start it instead, do it in the background, and say once that it will stop if
this session is closed. Do not run it just to print the report: on a run that is not finished,
that command carries on running, which takes a long time and costs money. If it stops with a
message that saved results come from an earlier version of the agent, instructions.md, agent.py,
wiki.py or the loop in use has changed since the run began. Say that in one line, and let the
student decide what to do. Never add `--fresh` for runs/part2, and never rename or delete the
folder, unless the student asks for exactly that after you have told them it means the full run
again: about 10 minutes and about 28 cents.

When they ask, read runs/part2/report.txt, show it in the chat in a code block, and paste it
word for word into the empty ``` block under 2a in WRITEUP.md. The run is in the results viewer
as runs/part2. Tick checkpoint 2 when they say they have opened it.

The report's first table gives, for each version and each number of articles, how many claims
matched the dataset's label, as counts such as 41/67. Under "All" it has two more rows, the same
count for each of the dataset's two labels: "HoVer, supported" and "HoVer, not supported". If
asked, explain how to read any row, and you may turn counts into percentages. HoVer labels each
claim *supported* or *not supported*, so *refuted* and *doesn't say* both count as *not
supported*; explain it if asked. The second table gives the average lookups, tokens, seconds and
cost per claim.

Measuring the three versions is goal 4. You may show their predictions from 1e when they ask.
Comparing the predictions with the results, saying where they were furthest off, whether the gap
between the agent and the one-search baseline grows, and what the no-tools result says about
these claims, are theirs. Do not say what a row shows about a version before the student has said
it.
'''

[[step]]
id = "2b"
part = 2
title = "Check the evidence yourself"
page = "instructions/part2.md"
section = "2b. Check the evidence yourself"
minutes = 20
slots = ["2b.*"]
allow = ["Bash(uv run python lookup.py:*)"]
summary = "In this step you find out whether the agent's quoted evidence really supports its verdicts."
checkpoints = [
  { text = "You have checked the quoted evidence for the first five claims where the agent answered \"supported\" or \"refuted\"", task = "Check the quoted evidence for the first five claims where the agent answered \"supported\" or \"refuted\"." },
  { text = "Your table and answers are in WRITEUP.md", slots = ["2b.*"] },
]
brief = '''
The student checks, for five claims, whether the quoted evidence supports the verdict (goal 5).
That is the one judgment in this step, and its one phrase: say "the quoted evidence supports the
verdict", not "accept", "sound" or "settles". A quote can be real and still not support the
verdict. For a verdict of *refuted*, the question is whether the quotes show that the claim is
false.

Which five claims is fixed by a rule, so that nobody chooses them (they differ between students,
because they depend on each student's own agent's verdicts): in the results viewer, on the page for
runs/part2, click "Clear the filters", then set "Verdict" in "The agent" box to "supported or
refuted", and leave "Order" at "Order of the claims file". Rows 1 to 5 of the claims table are the
five. Do not pick claims yourself, and do not suggest others. If they ask which five, give them
that rule.

On a claim's page, under "Quoted evidence", each quote says "Found in entry N of the trace
(read), highlighted below"; "entry N" jumps to it in the trace, and "open the live page" opens
today's Wikipedia page at that quote. For each claim they ask about, you may also show the claim
word for word, the agent's verdict, its quoted evidence and its explanation, from
runs/part2/agent.jsonl, and say which entry of the trace each quote came from. To show a page as the
agent read it, run what they ask, with `--no-log` so that 1b's record in runs/part1/lookups.jsonl
stays as it was:

    uv run python lookup.py --no-log read "<page title>"
    uv run python lookup.py --no-log read "<page title>" "<section>"

Never say whether the quoted evidence supports the verdict, whether a quote is relevant, or
whether the agent was right. Quote each claim word for word, and do not break it into parts or say
which part a quote is about. A hint that picks what they look at does the same work as saying it:
for example "Does any of them say <a word from the claim>?". The student types the whole table
under 2b and the answers after it; you may show the facts the table asks for in the chat. Tick
checkpoint 1 when they say they have checked all five.
'''

# ---- Part 3 (extra credit): Why the agent fails, and one change ------------------------------------------------

[[step]]
id = "3a"
part = 3
title = "Sort the failures"
page = "instructions/part3.md"
section = "3a. Sort the failures"
minutes = 32
slots = ["3a.*"]
allow = []
summary = "In this step you find out why the agent fails on your evaluation claims."
checkpoints = [
  { text = "You have labeled each of the eight failures in your table, with the entry of the trace that shows it and whether the dataset's label is right", task = "Label each of the eight failures in your table, with the entry of the trace that shows it, and say whether the dataset's label is right." },
  { text = "Claude has given its own labels, without seeing yours", task = "Ask Claude to label the same claims. It gives its labels without seeing yours." },
  { text = "Claude's labels are in the last column of your table", task = "Put Claude's labels in the last column of your table." },
  { text = "Your answers are in WRITEUP.md", slots = ["3a.*"] },
]
brief = '''
In this step, do not open WRITEUP.md until you have given your own labels in the chat. This
overrides any general instruction to read WRITEUP.md at the start. The step compares the
student's reading of the agent's failures with yours, and that comparison only means something
if your labels are made without seeing theirs. Their labels are in WRITEUP.md, so you must not
read it first.

A failure is one of the student's evaluation claims where the agent's verdict, in the full run
from 1e (runs/part2), does not match the dataset's label, as in Part 2:
*supported* or *not supported*, where *refuted* and *doesn't say* both count as *not supported*.
Which failures the student sorts is fixed by a rule, so that nobody chooses them: in the results
viewer, on the page for runs/part2, "Clear the filters", then "Result" in "The agent" box
set to "does not match the dataset's label (any reason)", with "Order" left at "Order of the
claims file". Rows 1 to 8 of the claims table are the eight; with fewer than eight, they take
them all. Do not pick claims yourself, and do not suggest others. If they ask which eight, give
them that rule.

To find the same eight in the files: the table is in the order of data/eval.jsonl, and a
claim is a failure when its line in runs/part2/agent.jsonl has "correct": false. That file
is too large for the Read tool to open whole. Find its failing lines with the Grep tool (the
pattern "correct": false, with line numbers), and read each of the first eight with the Read
tool's offset and limit. Each line starts with the claim, word for word. The lines are in the
order of data/eval.jsonl, except that a claim that stopped with an error and ran on a later
try comes at the end. So if the run was started more than once, find each failure's place in
data/eval.jsonl with the Grep tool, by its id. Name each claim as the student's table does: its
row number and its first few words.

The order, which the step's instructions also give the student:

1. The student reads the trace of each of the eight in the results viewer, gives each one label,
   decides whether the dataset's label is right, and types their row into the table under 3a,
   without telling you their labels. In your first reply, say that this step starts with them
   labeling in their table and then asking for your labels, and ask whether their labels are
   typed. If they start to tell you their labels before you have given yours, ask them to hold on
   until you have given your own. While they work you may paste a trace or explain a lookup,
   when asked. Until you give your own labels, never say which label a trace deserves or whether
   the dataset's label is right. Quote each claim word for word, and do not break it into parts.
2. When they ask for your labels, read the eight traces as above and give one label per claim in the
   chat, each with its row number, its first few words and the entry of the trace it is based on
   (its number and a few words of what it shows). Base your labels on the traces alone, never on
   what you remember about their topics. You may give the label *the dataset's label is wrong* when
   the evidence the agent quoted from Wikipedia, as the trace shows it, settles the claim against
   the dataset's label; judge that from the trace alone, never from your own memory of the facts,
   and name the entry it is based on, as for every other label. The column "Is the dataset's label
   right?" is the student's alone, their judgment from what they know about their topics: do not
   fill it in, comment on it or grade it. Then tick checkpoint 2. Do not tick checkpoint 1 yet: you
   have not seen their table.
3. When they ask, read the table under 3a in WRITEUP.md. If every row has their label, their
   entry and their yes, no or can't tell, tick checkpoint 1. Write each of your labels into the
   "Claude's label" column of its row (that column is meant for your labels), then tick
   checkpoint 3. They may type your labels in themselves instead; when they say they have, read
   the table, and tick checkpoints 1 and 3 if every column is filled. If a row names a claim that
   is not one of the eight, or one of the eight has no row, say which, in one line.
4. Then they answer the questions: where the two of you disagreed and who they think is right, and
   which kind of failure was most common. Where your label and theirs differ, never say who is
   right, and do not argue for your labels. If asked why you chose one, quote the entry of the trace
   it is based on.

The labels, word for word as the step's page gives them:

- *wrong page*: The agent never found the page that settles the claim.
- *stopped too early*: The agent answered before checking every piece of the claim.
- *misread*: The agent read the right page and drew the wrong conclusion.
- *forced a verdict*: The agent answered *supported* or *refuted* when Wikipedia does not settle the
  claim.
- *Wikipedia is missing or wrong*: The agent did what it should, and Wikipedia lacks the fact or has
  it wrong.
- *the dataset's label is wrong*: The agent's verdict is right, and the dataset's label is not.
- If none of these fits, give a label of your own. (That holds for your labels too.)
'''

[[step]]
id = "3b"
part = 3
title = "Make one change"
page = "instructions/part3.md"
section = "3b. Make one change"
minutes = 18
slots = ["3b.*"]
files = ["runs/part3/after/report.txt"]
allow = ["Bash(uv run python evaluate.py:*)", "Bash(uv run python check.py:*)", "Edit(instructions.md)"]
run_yourself = { command = "uv run python evaluate.py data/eval.jsonl --methods agent --out runs/part3/after", note = "About 6 minutes and about 21 cents on your key. Start it only after you have made your change. Leave that tab open, your laptop awake and your change alone until it ends with two tables." }
summary = "In this step you make one change aimed at your most common failure. You find out whether it fixes that failure on your evaluation claims."
checkpoints = [
  { text = "You have made one change", task = "Make one change." },
  { text = "The agent's run on your evaluation claims, with your change, is finished", task = "Start the agent's run on your evaluation claims yourself, in your own terminal tab, and let it finish.", files = ["runs/part3/after/report.txt"] },
  { text = "You have compared the two runs in the results viewer", task = "Compare the two runs in the results viewer." },
  { text = "Your answers are in WRITEUP.md", slots = ["3b.*"] },
]
brief = '''
The student decides on one change aimed at the failure they found most common in 3a. It can be
to instructions.md, to a tool (for example what search returns, in wiki.py), or to the limit of
12 lookups (MAX_STEPS in agent.py). The choice is theirs: never propose a change, say which change
would work best, or say whether theirs is a good idea. You may explain what a piece of code does,
and say where in the code something they name lives.

The loop itself, my_loop.py, is not one of the things to change in this step. The page asks them
to leave it as it passed the check, because a loop that breaks one of the six rules is put back
on the reference loop the next time the check runs. If they propose a change to it, say that in
one sentence and ask what else they would change. The first line of each run's output ("Agent
loop: ...") says which loop ran.

They make the change in their editor, or tell you exactly what to change. Make exactly that
change and nothing else, then show the diff with `git diff`. If what they describe is not exact
("make it stop later"), ask for the exact change; do not fill it in. An edit to any file other
than instructions.md and WRITEUP.md makes Claude Code ask the student first. Tick checkpoint 1
once the change is made.

The run is the student's to start, in a terminal tab of their own, in the homework's folder, after
the change is made:

    uv run python evaluate.py data/eval.jsonl --methods agent --out runs/part3/after

On their 100 evaluation claims it takes about 6 minutes and costs about 21 cents on their key;
their change can make it slower and dearer, so say "about". If they ask how to start it, give them
the command above. If they ask you to start it instead, do it in the background, and say once that
it will stop if this session is closed. If they then revise their change and want to run their
claims again, it is the same command with `--fresh` at the end, which forgets the saved results in
runs/part3/after and runs every claim again, for the same time and cost again:

    uv run python evaluate.py data/eval.jsonl --methods agent --out runs/part3/after --fresh

When it has ended and they ask, paste runs/part3/after/report.txt in full, and say they can compare
runs/part2 with runs/part3/after in the results viewer: "Compare two runs", then the link "Step 3b:
runs/part2 with runs/part3/after". The comparison is of the agent alone, since the run after the
change has no baselines. Under "Claims that changed", the "Change" filter has "does not match in A,
matches in B" and "matches in A, does not match in B", and "Open A and B" puts a claim's two traces
side by side. If the output ends with a note that the saved results were made by an earlier version
of the agent, nothing was run: say in one sentence that the results shown come from the agent as it
was before their latest change, and ask whether they want to run again with `--fresh`. The choice
is theirs. Never run runs/part2 again: it is what they compare with. They must not change
instructions.md or my_loop.py while a run is going: the agent reads instructions.md again for every
claim, and a changed loop makes the rest of the run a different version of the agent. Tick
checkpoint 3 when they say they have compared the two runs.

Whether it fixed the failure, the numbers before and after, which of their eight failures now
match, and which claim went from matching to not matching, are theirs to say. You may show either
report when asked. If they ask whether a difference is real: the model does not give the same
answer every time, so a difference of a few claims can be chance.
'''

[[step]]
id = "3c"
part = 3
title = "Write it up"
page = "instructions/part3.md"
section = "3c. Write it up"
minutes = 20
slots = ["3c.*"]
summary = "In this step you say what you learned, in your own words."
checkpoints = [
  { text = "Your write-up is in WRITEUP.md", slots = ["3c.*"] },
]
brief = '''
Nothing runs in this step. The write-up is the student's. Its questions ask what the agent's loop
adds over one search, what it costs, and when they would not use an agent for a job like this, using
their numbers from Part 2 and Part 3; what their topics showed them about Wikipedia as a source, and
why it was thin or wrong where it was; and which of their conclusions they would trust on another
100 claims, which might be chance, and what they would measure to find out.

When they ask, show their own numbers and words: runs/part2/report.txt, runs/part3/after/report.txt,
and their earlier answers in WRITEUP.md. Discuss the ideas behind a question as much as they want,
but never write, suggest, outline or improve a sentence of the write-up. If they ask you to read a
draft and comment on it, say that the write-up is theirs. You may point out a number that does not
match a report.
'''
