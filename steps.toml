checkpoints = [
  "You said what you expect the model to say",
  { text = "The no-tools baseline's answer is saved in runs/part0/", files = ["runs/part0/no-tools-*.json"] },
  { text = "Your answers are in WRITEUP.md", slots = ["0b.*"] },
]
brief = '''
The claim, word for word: "[[SAMPLE_CLAIM]]"

The command:

    uv run python check.py --method no-tools --out runs/part0 "[[SAMPLE_CLAIM]]"

The no-tools baseline asks the model for a verdict from memory alone: no search, no page, no
lookups. It is the first of the three versions the student will compare.

Before running, ask what they expect the model to say. When they answer, note it with
`expected` and tick checkpoint 1. Run the command when they ask. Paste the output in full, and
say the run is saved in runs/part0/ (check.py saves it there by itself; do not redirect it).

The verdict and the reason the model gave are in the output; let the student read them. How much
to trust that answer, and why, is theirs to say. Never say whether the verdict is right, and do
not look the claim up any other way: the next two steps are how the student finds out.

If the run fails because of the key, follow the tutor rules on .env.
'''

