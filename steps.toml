id = "0a"
part = 0
title = "Get your copy running"
page = "instructions/part0.md"
section = "0a. Get your copy running"
minutes = 20
setup = true
slots = ["Name"]
files = [".env"]
allow = ["Bash(uv sync)", "Bash(uv --version)", "Bash(uv run pytest:*)", "Bash(test -f .env)"]
summary = "Get your copy of the homework running, with your name in WRITEUP.md and your key in .env."
goal = "Nothing yet. This step gets the homework running on your laptop."
checkpoints = [
  "Start this step's Claude session with the command on this page, and answer Claude Code's question about trusting the folder",
  { text = "Type your name after Name: at the top of WRITEUP.md", slots = ["Name"] },
  { text = "In your editor, copy .env.example to .env and fill in your API key and your Macalester email", files = [".env"] },
  "Ask Claude to run the tests",
  "Ask Claude to check that .env is there",
]
brief = '''
This is the set-up step, so you may take the student through its actions in order. Before this
session started, the student forked the repository, cloned their fork, and started the homework
page. The actions, in order:

1. They started this session with the command on the homework page, and answered Claude Code's
   question about trusting the folder. Tick checkpoint 1 in your first reply, then say what the
   next action is.
2. They type their name after "Name:" at the top of WRITEUP.md, in their editor. Do not type it
   for them.
3. In their editor, they copy .env.example to a new file named .env. After ANTHROPIC_API_KEY=
   they paste the API key the instructor sent them by Slack direct message, and after
   WIKIPEDIA_CONTACT= they type their Macalester email. Never create, open, read or edit .env,
   even to help. Tell them how, and wait.
4. They ask you to run the tests: `uv run pytest -q`. The tests need no key and no network. Paste
   the output in full. If `uv` is not found, `uv --version` shows whether it is installed. If
   packages are missing, `uv sync` installs them.
5. They ask you to check that .env is there: `test -f .env`. It prints nothing. Exit code 0 means
   the file is there; exit code 1 means it is not. Report it in one line. This check is all you
   ever do with .env.

Tick checkpoints 4 and 5 once each is done and .env exists. (The page shows every checkpoint
above a ticked one as reached, so ticking 4 before .env exists would show checkpoint 3 as done.)

The key itself is tested by the first real run, in 0b. When everything is done, say in one line
what works, and that 0b is next, in its own session on the homework page.
'''

[[step]]
id = "0b"
part = 0
title = "Ask the model with no tools"
page = "instructions/part0.md"
