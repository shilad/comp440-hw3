minutes = 20
setup = true
slots = ["Name"]
files = [".env", "runs/part0/setup-check.txt"]
allow = ["Bash(uv sync)", "Bash(uv --version)", "Bash(uv run python check_setup.py)", "Bash(uv run pytest:*)"]
summary = "Get your copy of the homework running, with your name in WRITEUP.md and your key in .env."
goal = "Getting the homework running on your laptop, so the later steps can reach Wikipedia and the Claude API."
checkpoints = [
  { text = "In a terminal tab of your own, in the homework's folder, run cp .env.example .env, to make your own .env", files = [".env"] },
  { text = "Type your name after Name: at the top of WRITEUP.md, and save", slots = ["Name"] },
  "Start this step's Claude session with the command on this page, in that tab, and answer Claude Code's question about trusting the folder",
  { text = "Fill in .env in your editor (your API key and your Macalester email) and save; then ask Claude to run the set-up check, until it says everything is ready", files = ["runs/part0/setup-check.txt"] },
]
brief = '''
This is the set-up step, so you may take the student through its actions in order. Before this
session started, the student forked the repository, cloned their fork, and started the homework
page. The actions, in order:

1. In a terminal tab of their own, in the homework's folder, they run `cp .env.example .env`.
   Then they open .env in their editor. After ANTHROPIC_API_KEY= they paste the API key the
   instructor sent them by Slack direct message, after WIKIPEDIA_CONTACT= they type their
   Macalester email, and they save. Never run that cp command yourself, and never create, open,
   read or edit .env, even to help: no Claude session writes .env. Never ask for the key. Files
   whose names start with a dot are hidden in Finder and in most Open windows: if their editor's
   Open window does not show .env, they press Command-Shift-period in that window, or open the
   whole comp440-hw3 folder in their editor.
2. They type their name after "Name:" at the top of WRITEUP.md, in their editor, and save. Do not
   type it for them.
3. They started this session in that tab, with the command on the homework page, and answered
   Claude Code's question about trusting the folder. Tick checkpoint 3 in your first reply. Run
   nothing in it: say that this step gets their copy running, and ask one question, whether
   .env is filled in and saved and their name typed. Then take them through what is left.
4. They ask you to run the set-up check:

       uv run python check_setup.py

   Paste its output in full. It prints one line for each of five things, marked ok or NOT READY:
   the .env file is there; the key is filled in; the email is filled in; Wikipedia answered a
   search; the Claude API accepted the key. It reads .env itself and reports only whether each
   line is filled in, so it never shows the key or the email. It costs a small fraction of a
   cent. Each NOT READY line says what to fix; the student fixes it in their editor, and you run
   the check again when they ask. Checkpoint 4 ticks itself: when every line is ok, the check
   saves the lines it printed in runs/part0/setup-check.txt (nothing from .env), and a later
   check that fails removes that file again.

If `uv` is not found, `uv --version` shows whether it is installed. If packages are missing,
`uv sync` installs them. If the student asks whether the code itself works, you may run the
offline tests, `uv run pytest -q`, which need no key and no network; do not bring them up
otherwise.

The step is done when the check says "Everything is ready." and their name is typed. Then say in
one line that 0b is next, in its own session on the homework page.
'''

[[step]]
id = "0b"
part = 0
title = "Ask the model with no tools"
page = "instructions/part0.md"
section = "0b. Ask the model with no tools"
minutes = 8
claim = true
slots = ["0b.*"]
files = ["runs/part0/no-tools-*.json"]
allow = ["Bash(uv run python check.py:*)"]
summary = "See how well the model checks the claim from memory alone."
goal = "How well the model checks a claim from memory alone, with no lookups. This is the no-tools baseline, the simplest of the three versions (no tools, one search, the agent) you will compare."
checkpoints = [
  "You said what you expect the model to say",
  { text = "The no-tools baseline's answer is saved in runs/part0/", files = ["runs/part0/no-tools-*.json"] },
  { text = "Your answers are in WRITEUP.md", slots = ["0b.*"] },
]
brief = '''
The command, with the claim above in it word for word:

    uv run python check.py --method no-tools --out runs/part0 'The composer of "Persian Surgery Dervishes" was born on June 24, 1935.'

Keep the single quotes: the claim has double quotes in it. You have no knowledge of this claim's
answer to share. Anything you say about it comes from the program's output in this session. Do
not say or hint who the composer is, whether the date is right, or which pages would settle it,
beyond quoting the output.

The no-tools baseline asks the model for a verdict from memory alone: no search, no page, no
lookups. It is the first of the three versions the student will compare.

Before running, ask what they expect the model to say. When they answer, note it with
`expected` and tick checkpoint 1. Run the command when they ask. Paste the output in full, and
say the run is saved in runs/part0/ (check.py saves it there by itself; do not redirect it).

The verdict and the reason the model gave are in the output; let the student read them. How much
to trust that answer, and why, is theirs to say. Never say whether the verdict is right, and do
not look the claim up any other way: the next two steps are how the student finds out.

If the run fails because of the key, follow the tutor rules on .env.
'''

[[step]]
id = "0c"
part = 0
title = "Give it one search"
