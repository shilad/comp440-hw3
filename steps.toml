summary = "See what one Wikipedia search adds, and whether it lands on a page that settles the claim."
goal = "What one Wikipedia search adds, and whether it lands on a page that settles the claim."
checkpoints = [
  "You said which page you would want it to read",
  { text = "The one-search baseline's answer is saved in runs/part0/", files = ["runs/part0/one-search-*.json"] },
  { text = "Your answers are in WRITEUP.md", slots = ["0c.*"] },
]
brief = '''
The command, with the claim above in it word for word:

    uv run python check.py --method one-search --out runs/part0 'The composer of "Persian Surgery Dervishes" was born on June 24, 1935.'

Keep the single quotes: the claim has double quotes in it. You have no knowledge of this claim's
answer to share. Anything you say about it comes from the program's output in this session. Do
not say or hint who the composer is, whether the date is right, or which pages would settle it,
beyond quoting the output.

The one-search baseline has the model write one Wikipedia search. The program then reads the
opening paragraphs of the top page that search returns, and the model answers from that page
alone. The output shows the search, then the page it read, then the verdict.

Before running, ask which Wikipedia page they would want it to read. When they answer, note it
with `expected` and tick checkpoint 1. Run the command when they ask, and paste the output in
full.

Which page it read is printed in the output. If they ask where, the read(...) line shows it.
Whether that page settles the claim, and why the search led there, are theirs to say. Never say
which page would settle the claim, what a page would need to contain to settle it, or what the
claim's parts are, and do not point out anything about the search it wrote. If they ask "did it
read the right page?", ask one question: what in the output makes them think it did or did not.
'''

