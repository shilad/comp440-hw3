<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homework page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="notices" id="notices"></div>
    <div class="label" id="course"></div>
    <h1 id="title">Loading…</h1>
    <p class="lede" id="lede"></p>
    <div class="lede goals" id="goals"></div>
    <div class="where">
      <span class="meter"><span class="bar"><i id="bar"></i></span><span class="nums" id="count"></span></span>
      <span class="next" id="next"></span>
      <span id="due"></span>
      <a href="/results/" target="_blank" rel="noopener">Results</a>
    </div>
  </div>
</header>

<main class="wrap" id="parts"></main>

<footer class="foot"><div class="wrap">You type your answers in <code>WRITEUP.md</code>, in your editor. When you
finish a part's last step, the page commits that part, with your Claude conversations in
<code>TRANSCRIPT.md</code>.</div></footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panel-title">
  <div class="panel-head"><h3 id="panel-title"></h3><button class="copy" id="panel-close" type="button">Close</button></div>
  <div class="panel-body" id="panel-body"></div>
</aside>
<script src="/static/app.js"></script>
</body>
</html>
